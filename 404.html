<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina non trovata · ShiftPro</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/shiftpro-site/logo.png">
<style>
  @font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 800;font-display:swap;
    src:url("/shiftpro-site/font/plus-jakarta-sans-latin.woff2") format("woff2");}
  :root{--verde:#1D9E75;--verde-scuro:#15794f;--testo:#1b1e26;--grigio:#5c6070;--bordo:#e8eaf0;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--testo);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .box{max-width:520px;text-align:center;}
  img{width:72px;height:72px;border-radius:18px;margin:0 auto 26px;display:block;box-shadow:0 8px 24px rgba(29,158,117,.28);}
  h1{font-size:clamp(1.7rem,4vw,2.2rem);font-weight:800;letter-spacing:-.02em;margin:0 0 12px;line-height:1.15;}
  p{color:var(--grigio);margin:0 0 28px;}
  a.btn{display:inline-flex;align-items:center;gap:8px;background:var(--verde);color:#fff;font-weight:700;
    border-radius:12px;padding:13px 22px;text-decoration:none;box-shadow:0 8px 20px rgba(29,158,117,.30);}
  a.btn:hover{background:var(--verde-scuro);}
  .altri{margin-top:26px;padding-top:20px;border-top:1px solid var(--bordo);font-size:.92rem;}
  .altri a{color:var(--grigio);font-weight:600;text-decoration:none;margin:0 9px;}
  .altri a:hover{color:var(--verde);}
</style>
</head>
<body>
  <div class="box">
    <img src="/shiftpro-site/logo.png" alt="ShiftPro">
    <h1>Questa pagina non esiste</h1>
    <p>Forse il link è vecchio o contiene un errore di battitura. Dalla home trovi tutto quello che c'è.</p>
    <a class="btn" href="/shiftpro-site/">Torna alla home</a>
    <div class="altri">
      <a href="/shiftpro-site/assistenza.html">Assistenza</a>
      <a href="/shiftpro-site/privacy.html">Privacy</a>
      <a href="/shiftpro-site/termini.html">Termini</a>
    </div>
  </div>
</body>
</html>
